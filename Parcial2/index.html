<!DOCTYPE html>
<html lang="en">

<head>

    <title>Heladeria Doña Nieves</title>

</head>

<body>
    <header>

        <h1>Heladería Doña Nieve</h1>

        <p>En Doña Nieve preperamos deliciosos helados con sabores para
            disfrutar en cualquier momento.
        </p>

    </header>

    <main>

        <section>

            <h2>Has tu pedido</h2>

            <form id="form-helados" novalidate method="POST" action="procesar.php">

                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="correo">Correo electronico:</label>
                <input type="email" id="correo" name="correo" required>

                <label for="sabores">Que sabores quieres:</label>
                <textarea id="sabores" name="sabores"></textarea>

                <button type="submit">Enviar mi pedido </button>
                <p id="aviso-helados" class="aviso"></p>

            </form>

        </section>

    </main>

    <footer>

        <p>Parcial 2 - Alex Brayan Flores Daga - 11 de agosto de 2026</p>

    </footer>
